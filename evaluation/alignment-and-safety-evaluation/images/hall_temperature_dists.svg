  </rect>

  <rect x="589" y="357.8" width="82" height="2.2" fill="#8B3B4A" stroke="#ffffff" stroke-width="1">
    <animate attributeName="y" values="357.8;357.8;354.8;351.1;347.4;343.9;343.9;338.2;334.0;330.9;328.6;328.6;330.9;334.0;338.2;343.9;347.4;351.1;354.8;357.8" keyTimes="0;0.1;0.15;0.2;0.25;0.3;0.4;0.45;0.5;0.55;0.6;0.7;0.75;0.8;0.85;0.9;0.925;0.95;0.975;1" dur="12s" repeatCount="indefinite"/>
