  <rect x="702.3" y="358.6" width="82" height="1.4" fill="#8B3B4A" stroke="#ffffff" stroke-width="1">
    <animate attributeName="y" values="358.6;358.6;356.2;353.2;349.9;346.8;346.8;341.4;337.2;334.0;331.5;331.5;334.0;337.2;341.4;346.8;349.9;353.2;356.2;358.6" keyTimes="0;0.1;0.15;0.2;0.25;0.3;0.4;0.45;0.5;0.55;0.6;0.7;0.75;0.8;0.85;0.9;0.925;0.95;0.975;1" dur="12s" repeatCount="indefinite"/>
