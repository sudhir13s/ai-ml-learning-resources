<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <!-- The temperature dial swept across the toy answer distribution, on one 12s SMIL clock:
       hold at T = 0.50, sweep up to T = 1.00, hold, sweep up to T = 2.00, hold, then sweep
       back down to T = 0.50 and loop — the same up-up-back sweep with holds at 0.5 / 1.0 /
       2.0 that the GIF ran. The bar heights are interpolated continuously between the exact
       softmax(z / T) values of the chapter's own toy question: ANSWER_VOCAB = (Austen,
       Bronte, Dickens, Eliot, Hardy, Gaskell) with BASE_LOGITS = (4.0, 2.2, 2.0, 1.8, 1.6,
       1.4) and SUPPORTED_IDX = 0, from code/hallucination_alignment.py. The supported
       answer holds 0.93 of the mass at T = 0.50, 0.63 at T = 1.00 and only 0.37 at
       T = 2.00 — the rest has leaked onto answers nothing supports. t = 0 is the readable
       T = 0.50 frame. -->
  <style>
    .panel { font-size: 13px; font-weight: bold; fill: #1C2530; }
    .lab   { font-size: 10.5px; fill: #4A5B6E; }
    .name  { font-size: 11.5px; font-weight: bold; fill: #1C2530; }
    .read  { font-size: 11.5px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-weight: bold; fill: #1C2530; }
  </style>

  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <text x="450" y="26" text-anchor="middle" class="panel">Temperature bleeds mass off the supported answer</text>

  <!-- the dial being swept, drawn so the sweep itself is visible -->
  <text x="590" y="52" text-anchor="end" class="lab">temperature T</text>
  <line x1="600" y1="48" x2="800" y2="48" stroke="#4A5B6E" stroke-width="1.4"/>
  <g stroke="#4A5B6E" stroke-width="1">
    <line x1="600" y1="43" x2="600" y2="53"/>
    <line x1="666.7" y1="43" x2="666.7" y2="53"/>
    <line x1="733.3" y1="43" x2="733.3" y2="53"/>
    <line x1="800" y1="43" x2="800" y2="53"/>
  </g>
  <g class="lab" text-anchor="middle">
    <text x="600" y="68">0.5</text>
    <text x="666.7" y="68">1.0</text>
    <text x="733.3" y="68">1.5</text>
    <text x="800" y="68">2.0</text>
  </g>
  <circle cx="600" cy="48" r="6" fill="#7A6528">
    <animate attributeName="cx" values="600;600;616.7;633.3;650;666.7;666.7;700;733.3;766.7;800;800;766.7;733.3;700;666.7;650;633.3;616.7;600" keyTimes="0;0.1;0.15;0.2;0.25;0.3;0.4;0.45;0.5;0.55;0.6;0.7;0.75;0.8;0.85;0.9;0.925;0.95;0.975;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- probability axis: p = 0 at y = 360, p = 1.0 at y = 80 (280 px per unit) -->
  <g stroke="#D4D9DF" stroke-width="0.8">
    <line x1="120" y1="304" x2="800" y2="304"/>
    <line x1="120" y1="248" x2="800" y2="248"/>
    <line x1="120" y1="192" x2="800" y2="192"/>
    <line x1="120" y1="136" x2="800" y2="136"/>
    <line x1="120" y1="80" x2="800" y2="80"/>
  </g>
  <line x1="120" y1="80" x2="120" y2="360" stroke="#4A5B6E" stroke-width="1.1"/>
  <line x1="120" y1="360" x2="800" y2="360" stroke="#4A5B6E" stroke-width="1.1"/>
  <g class="lab" text-anchor="end">
    <text x="113" y="364">0.0</text>
    <text x="113" y="308">0.2</text>
    <text x="113" y="252">0.4</text>
    <text x="113" y="196">0.6</text>
    <text x="113" y="140">0.8</text>
    <text x="113" y="84">1.0</text>
  </g>
  <text x="52" y="220" class="lab" text-anchor="middle" transform="rotate(-90 52 220)">probability</text>

  <!-- six bars: the supported answer in green, the five unsupported distractors in red -->
  <rect x="135.7" y="98.7" width="82" height="261.3" fill="#2E7A5A" stroke="#ffffff" stroke-width="1">
