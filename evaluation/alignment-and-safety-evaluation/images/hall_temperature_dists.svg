  </rect>

  <rect x="362.3" y="355.2" width="82" height="4.8" fill="#8B3B4A" stroke="#ffffff" stroke-width="1">
    <animate attributeName="y" values="355.2;355.2;350.2;344.9;340.0;336.0;336.0;330.0;326.1;323.4;321.6;321.6;323.4;326.1;330.0;336.0;340.0;344.9;350.2;355.2" keyTimes="0;0.1;0.15;0.2;0.25;0.3;0.4;0.45;0.5;0.55;0.6;0.7;0.75;0.8;0.85;0.9;0.925;0.95;0.975;1" dur="12s" repeatCount="indefinite"/>
