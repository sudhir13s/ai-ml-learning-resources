<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <!-- One K/V tile sweeping the key axis, in 4 discrete beats on a shared 12s SMIL clock
       (tile 0 -> 1 -> 2 -> 3, then a short return to the tile-0 state so the loop does not
       jump). Left: the 8x8 score grid - the active 2-column tile is green, already-streamed
       tiles are faint blue (their contribution folded in and thrown away), and the tiles not
       yet seen stay grey, because the full N x N matrix is never assembled. Right: the sticky
       note carrying the only state that survives between tiles - the running max m, the
       running denominator l, and the correction factor applied when m jumps. The (m, l, corr)
       numbers are the exact seeded trace emitted by
       deep-learning/attention-and-transformers/efficient-attention/code/flash_attention.py
       (online_softmax_trace, N=8, d=4, block=2, seed 0) - the same numbers
       the retired generator tools/make_animation_06.py drew; flash_attention.py is still in the
       repo and reproduces them exactly. The tile-0 state is drawn at t=0, so the first frame
       is already a complete, readable figure. -->
  <style>
    .panel  { font-size: 13px; font-weight: bold; fill: #1C2530; }
    .lab    { font-size: 10.5px; fill: #4A5B6E; }
    .mono   { font-size: 10.5px; font-family: "DejaVu Sans Mono", Menlo, monospace; fill: #1C2530; }
    .monodim{ font-size: 10.5px; font-family: "DejaVu Sans Mono", Menlo, monospace; fill: #7C8794; }
    .val    { font-size: 15px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-weight: bold; text-anchor: end; }
    .msg    { font-size: 10.5px; font-weight: bold; text-anchor: middle; }
    .tile   { font-size: 10.5px; font-weight: bold; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <text x="450" y="26" text-anchor="middle" class="panel" font-size="13.5">FlashAttention: stream one tile, update the running softmax, never materialize the matrix</text>

  <!-- ============================ LEFT: the score grid ============================ -->
  <text x="24" y="56" class="panel" font-size="11">Score grid &#8212; never assembled in full</text>
  <text x="196" y="80" class="lab" text-anchor="middle">keys &#8212; one K/V tile at a time &#8594;</text>

  <!-- four block columns; each block is 2 key columns wide and changes state discretely -->
  <rect x="60" y="92" width="68" height="272" fill="#2E7A5A" fill-opacity="0.92">
    <animate attributeName="fill" values="#2E7A5A;#3A6B96;#3A6B96;#3A6B96;#2E7A5A" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.92;0.30;0.30;0.30;0.92" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect x="128" y="92" width="68" height="272" fill="#E7EAEE" fill-opacity="0.55">
    <animate attributeName="fill" values="#E7EAEE;#2E7A5A;#3A6B96;#3A6B96;#E7EAEE" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.55;0.92;0.30;0.30;0.55" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect x="196" y="92" width="68" height="272" fill="#E7EAEE" fill-opacity="0.55">
    <animate attributeName="fill" values="#E7EAEE;#E7EAEE;#2E7A5A;#3A6B96;#E7EAEE" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.55;0.55;0.92;0.30;0.55" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect x="264" y="92" width="68" height="272" fill="#E7EAEE" fill-opacity="0.55">
    <animate attributeName="fill" values="#E7EAEE;#E7EAEE;#E7EAEE;#2E7A5A;#E7EAEE" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.55;0.55;0.55;0.92;0.55" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- cell separators, drawn in the page ground so the 8x8 grid stays visible -->
  <g stroke="#ffffff" stroke-width="2">
    <line x1="94" y1="92" x2="94" y2="364"/>
    <line x1="128" y1="92" x2="128" y2="364"/>
    <line x1="162" y1="92" x2="162" y2="364"/>
    <line x1="196" y1="92" x2="196" y2="364"/>
    <line x1="230" y1="92" x2="230" y2="364"/>
    <line x1="264" y1="92" x2="264" y2="364"/>
    <line x1="298" y1="92" x2="298" y2="364"/>
    <line x1="60" y1="126" x2="332" y2="126"/>
    <line x1="60" y1="160" x2="332" y2="160"/>
    <line x1="60" y1="194" x2="332" y2="194"/>
    <line x1="60" y1="228" x2="332" y2="228"/>
    <line x1="60" y1="262" x2="332" y2="262"/>
    <line x1="60" y1="296" x2="332" y2="296"/>
    <line x1="60" y1="330" x2="332" y2="330"/>
  </g>
  <rect x="60" y="92" width="272" height="272" fill="none" stroke="#D4D9DF"/>

  <!-- the query whose running softmax the sticky note tracks -->
  <rect x="60" y="92" width="272" height="34" fill="none" stroke="#5D4A8A" stroke-width="2.6"/>
  <text x="54" y="114" class="lab" text-anchor="end" fill="#5D4A8A" font-weight="bold">query 0</text>

  <!-- the bracket under the active tile -->
  <rect x="60" y="370" width="68" height="8" fill="#2E7A5A">
    <animate attributeName="x" values="60;128;196;264;60" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>
  <g class="tile">
    <text x="94" y="394" fill="#2E7A5A">tile 0<animate attributeName="fill" values="#2E7A5A;#7C8794;#7C8794;#7C8794;#2E7A5A" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="162" y="394" fill="#7C8794">tile 1<animate attributeName="fill" values="#7C8794;#2E7A5A;#7C8794;#7C8794;#7C8794" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="230" y="394" fill="#7C8794">tile 2<animate attributeName="fill" values="#7C8794;#7C8794;#2E7A5A;#7C8794;#7C8794" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="298" y="394" fill="#7C8794">tile 3<animate attributeName="fill" values="#7C8794;#7C8794;#7C8794;#2E7A5A;#7C8794" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <text x="24" y="414" class="monodim"><tspan fill="#2E7A5A">green</tspan> = the tile in SRAM right now</text>
  <text x="24" y="429" class="monodim"><tspan fill="#3A6B96">blue</tspan>  = streamed, folded in, discarded</text>
  <text x="24" y="444" class="monodim">grey  = never materialized at all</text>

  <!-- ======================= RIGHT: the running-softmax sticky note ======================= -->
  <text x="380" y="56" class="panel" font-size="11">Online softmax &#8212; running statistics (query 0)</text>

  <rect x="380" y="72" width="492" height="306" rx="10" fill="#FBF7E9" stroke="#7A6528" stroke-width="2"/>
  <text x="626" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#7A6528">sticky note (per query)</text>
  <text x="626" y="118" text-anchor="middle" class="lab" font-style="italic">two scalars + an output accumulator &#8212; all of O(1)</text>

  <text x="400" y="162" font-size="13" font-weight="bold" fill="#5D4A8A">running max  <tspan font-style="italic">m</tspan></text>
  <g class="val" fill="#5D4A8A">
    <text x="852" y="162">+0.3350<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="852" y="162" opacity="0">+0.3730<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="852" y="162" opacity="0">+1.4647<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  </g>

  <text x="400" y="202" font-size="13" font-weight="bold" fill="#7A6528">running denom  <tspan font-style="italic">&#8467;</tspan></text>
  <g class="val" fill="#7A6528">
    <text x="852" y="202">1.4390<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="852" y="202" opacity="0">2.1709<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="852" y="202" opacity="0">3.6028<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="852" y="202" opacity="0">2.2857<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  </g>

  <line x1="400" y1="224" x2="852" y2="224" stroke="#7A6528" stroke-opacity="0.35"/>

  <!-- what the block did to (m, l) -->
  <g class="msg" fill="#4A5B6E">
    <animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="626" y="256">block 0: seed <tspan font-style="italic">m</tspan>, <tspan font-style="italic">&#8467;</tspan> from this tile</text>
    <text x="626" y="276">nothing to rescale yet &#8212; there is no prior state</text>
  </g>
  <g class="msg" fill="#4A5B6E" opacity="0">
    <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="626" y="256"><tspan font-style="italic">m</tspan> unchanged &#8594; corr = 1.000</text>
    <text x="626" y="276">(no rescale; just add this tile)</text>
  </g>
  <g class="msg" fill="#8B3B4A" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="626" y="256"><tspan font-style="italic">m</tspan> jumped &#8594; corr = <tspan font-style="italic">e</tspan><tspan font-size="8" baseline-shift="super">m_old &#8722; m_new</tspan> = 0.963</text>
    <text x="626" y="276">old <tspan font-style="italic">&#8467;</tspan> and acc rescaled by 0.963 before adding</text>
  </g>
  <g class="msg" fill="#8B3B4A" opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="626" y="256"><tspan font-style="italic">m</tspan> jumped &#8594; corr = <tspan font-style="italic">e</tspan><tspan font-size="8" baseline-shift="super">m_old &#8722; m_new</tspan> = 0.336</text>
    <text x="626" y="276">old <tspan font-style="italic">&#8467;</tspan> and acc rescaled by 0.336 before adding</text>
  </g>

  <g text-anchor="middle" class="mono" font-size="11">
    <text x="626" y="314">after block 0 of 3<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="626" y="314" opacity="0">after block 1 of 3<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="626" y="314" opacity="0">after block 2 of 3<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="626" y="314" opacity="0">after block 3 of 3<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.23;0.46;0.69;0.92" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  </g>

  <text x="626" y="352" text-anchor="middle" class="lab" font-style="italic"><tspan font-style="italic">m</tspan> and <tspan font-style="italic">&#8467;</tspan> are the only state carried between tiles &#8212; O(1), independent of N</text>

  <text x="380" y="406" class="lab">Tile 3 carries much larger scores, so <tspan font-weight="bold">m</tspan> jumps from +0.3730 to +1.4647 and the</text>
  <text x="380" y="423" class="lab">correction <tspan font-style="italic">e</tspan><tspan font-size="8" baseline-shift="super">m_old &#8722; m_new</tspan> = 0.336 re-bases the accumulated <tspan font-weight="bold">&#8467;</tspan> and the output accumulator</text>
  <text x="380" y="440" class="lab">onto the new max <tspan font-weight="bold">before</tspan> the tile is added &#8212; which is why <tspan font-weight="bold">&#8467;</tspan> falls, 3.6028 &#8594; 2.2857.</text>
</svg>
