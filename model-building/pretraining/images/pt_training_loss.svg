<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <!-- The pretraining loss curve drawn point by point on a 12s SMIL clock: a clip window
       sweeps left to right for the first 8.2s (steps 0 -> 299, one constant step rate), a
       marker rides the curve, and the readout below reports tokens seen / step / loss / lr
       at the step under the marker; the last 3.8s hold the finished curve (the same
       proportion the GIF held its final frame). The faint traces behind the bold ones are
       the complete run, so t = 0 is already a readable frame.
       Every number is the seeded real-recipe run returned by training_loop_trace() in
       code/pretraining_at_scale.py (AdamW, betas 0.9/0.95, linear warmup over 20 steps
       then cosine decay, grad clipping): loss 2.840 -> 0.751 over 300 steps, lr 0 ->
       3.00e-04 at step 20 -> 3.00e-05 at step 299, tokens seen = (step+1) x CONTEXT_LEN
       (8) with batch size 1, i.e. 2,400 tokens in total. Nothing is invented or rounded
       differently from the trace. -->
  <style>
    .panel  { font-size: 13px; font-weight: bold; fill: #1C2530; }
    .lab    { font-size: 10.5px; fill: #4A5B6E; }
    .axloss { font-size: 10.5px; fill: #3A6B96; }
    .axlr   { font-size: 10.5px; fill: #7A6528; }
    .read   { font-size: 11.5px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-weight: bold; fill: #1C2530; }
  </style>

  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <text x="450" y="26" text-anchor="middle" class="panel">Pretraining: the loss falls as tokens stream through the model</text>

