  </circle>

  <g>
    <line x1="240" y1="230" x2="266" y2="230" stroke="#2E7A5A" stroke-width="2.6"/>
    <text x="272" y="234" class="lab">log &#960;(chosen) &#8212; rises</text>
    <line x1="240" y1="250" x2="266" y2="250" stroke="#8B3B4A" stroke-width="2.6"/>
    <text x="272" y="254" class="lab">log &#960;(rejected) &#8212; falls</text>
  </g>

  <!-- =============================== RIGHT PANEL =============================== -->
  <text x="695" y="50" class="panel" text-anchor="middle">Margin grows, loss falls</text>

  <line x1="530" y1="66" x2="530" y2="368" stroke="#5D4A8A" stroke-width="1.2"/>
