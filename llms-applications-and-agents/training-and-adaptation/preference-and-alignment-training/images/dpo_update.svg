<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <!-- The measured toy-DPO run, animated on one 12s SMIL clock. Two clip rectangles (one per
       panel) sweep left to right in lockstep, so the four traces are DRAWN step by step, with
       leading dots and a live step/margin/loss counter. Same data as the retired tools/make_animations_15.py
       and dpo_update.png: the seeded run_toy_dpo() in code/rlhf_dpo.py (beta = 0.1, lr = 2.0,
       120 SGD steps). Both log-probs start AT the frozen reference (-5.0); by step 120 chosen has
       risen to +2.35 and rejected fallen to -12.35, so the implicit-reward margin is 1.47 and the
       DPO loss has decayed from log 2 = 0.693 to 0.207. The drawing occupies t=0..0.813 and the
       final state is held to t=1, mirroring the generator's 61 reveal frames + 14 hold frames.
       Dim dashed ghosts of the full traces are present at t=0, so the first frame is readable. -->
  <style>
    .title  { font-size: 14px; font-weight: bold; fill: #1C2530; }
    .panel  { font-size: 13px; font-weight: bold; fill: #1C2530; }
    .lab    { font-size: 10.5px; fill: #4A5B6E; }
    .axis   { font-size: 10px; fill: #4A5B6E; }
    .mono   { font-size: 10.5px; font-family: "DejaVu Sans Mono", Menlo, monospace; fill: #1C2530; }
    .count  { font-size: 12px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-weight: bold; fill: #1C2530; }
  </style>

  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <text x="450" y="26" class="title" text-anchor="middle">A measured DPO update, watched happening: chosen up, rejected down  (&#946; = 0.1)</text>

  <!-- =============================== LEFT PANEL =============================== -->
  <text x="247" y="50" class="panel" text-anchor="middle">DPO splits chosen from rejected</text>

  <line x1="70" y1="66" x2="70" y2="368" stroke="#4A5B6E" stroke-width="1.2"/>
  <line x1="70" y1="368" x2="425" y2="368" stroke="#4A5B6E" stroke-width="1.2"/>
  <g class="axis" text-anchor="end">
    <text x="64" y="354">-12</text>
    <text x="64" y="316">-10</text>
    <text x="64" y="278">-8</text>
    <text x="64" y="240">-6</text>
    <text x="64" y="202">-4</text>
    <text x="64" y="164">-2</text>
    <text x="64" y="126">0</text>
    <text x="64" y="88">2</text>
  </g>
  <g class="axis" text-anchor="middle">
    <text x="70" y="382">0</text>
    <text x="129.2" y="382">20</text>
    <text x="188.3" y="382">40</text>
    <text x="247.5" y="382">60</text>
    <text x="306.7" y="382">80</text>
    <text x="365.8" y="382">100</text>
    <text x="425" y="382">120</text>
  </g>
  <text x="247" y="400" class="lab" text-anchor="middle">DPO training step</text>
  <text x="24" y="217" class="lab" text-anchor="middle" transform="rotate(-90 24 217)">log-probability</text>

  <!-- the shared frozen reference both log-probs start from -->
  <line x1="70" y1="217" x2="425" y2="217" stroke="#4A5B6E" stroke-width="1.1" stroke-dasharray="2 3"/>
  <text x="176" y="186" class="lab">both start at the</text>
  <text x="176" y="200" class="lab">reference (-5.0)</text>

  <!-- ghosts: the whole run, dim, so t=0 is readable -->
  <g fill="none" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.4">
    <path stroke="#2E7A5A" d="M70.0 217.0 L81.8 209.5 L93.7 202.3 L105.5 195.4 L117.3 188.8 L129.2 182.4 L141.0 176.3 L152.8 170.3 L164.7 164.7 L176.5 159.2 L188.3 153.9 L200.2 148.8 L212.0 143.9 L223.8 139.1 L235.7 134.6 L247.5 130.1 L259.3 125.8 L271.2 121.7 L283.0 117.6 L294.8 113.7 L306.7 109.9 L318.5 106.3 L330.3 102.7 L342.2 99.2 L354.0 95.9 L365.8 92.6 L377.7 89.4 L389.5 86.3 L401.3 83.2 L413.2 80.3 L425.0 77.4"/>
