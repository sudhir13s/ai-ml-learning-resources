  <!-- ========== the point of the figure: step 0 is exactly zero ========== -->
  <circle cx="100" cy="372" r="6.5" fill="#2E7A5A"/>
  <path d="M196 236 C 160 260, 118 330, 106 366" fill="none" stroke="#4A5B6E" stroke-width="1.2" marker-end="url(#arw)"/>
