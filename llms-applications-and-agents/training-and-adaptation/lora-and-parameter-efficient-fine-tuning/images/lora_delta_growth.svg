<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <!-- max|DeltaW| over 300 training steps, drawn on over a 12s SMIL loop. The trace is the
       measured run this asset replaces: seed 0, d = 1024, r = 8, alpha = 16, 256 synthetic
       samples whose true update has rank 4, Adam at lr 1e-2 - i.e. the same seeded construction
       order as the chapter's lora_peft.py, reproduced from the retired make_animations_12
       generator's _delta_growth_history(). Every plotted value is that run: 0.0000 at step 0 (B = 0), a
       peak of 0.0939 at step 15, a dip to 0.0632 at step 29, then a plateau of 0.0679 that holds
       from about step 150 to step 300. The curve is revealed left to right at a rate linear in
       training step (0 -> 9.8s), the marker rides the same path, and the readout under the plot
       reports the step and the value at the marker. The axes, the title, the step-0 annotation
       and the green step-0 marker are static, so t=0 already carries the point of the figure. -->
  <style>
    .title  { font-size: 15px; font-weight: bold; fill: #1C2530; }
    .axname { font-size: 11.5px; fill: #1C2530; }
    .tick   { font-size: 10px; font-family: "DejaVu Sans Mono", Menlo, monospace; fill: #4A5B6E; }
    .lab    { font-size: 10.5px; fill: #4A5B6E; }
    .note   { font-size: 10.5px; fill: #1C2530; }
    .read   { font-size: 12px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-weight: bold; fill: #1C2530; }
  </style>

  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" class="title">&#916;W starts at exactly 0 (B = 0), then the adapter walks away</text>

