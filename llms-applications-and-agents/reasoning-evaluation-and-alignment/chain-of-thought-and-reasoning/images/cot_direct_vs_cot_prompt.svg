<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <!-- Two prompt structures on the same word problem, revealed in 7 discrete phases on one
       12s SMIL clock (the phase lengths keep the GIF's 900/1100/1000/1000/1100/1100/2600 ms
       proportions): both questions are posed, the direct prompt blurts "9", then the chain
       of thought unfolds one line at a time — start 12, pour out 1/3 of 12 = 4 leaving 8,
       add 5 to get 13 — and the worked answer and the two verdicts land last and hold.
       The problem, both answers and every line of the chain are the ones the chapter's
       static twin draws in tools/make_figures_17.py; nothing is paraphrased. Phase 1 is
       already a readable frame: both panels, both titles and the question are drawn at
       t = 0. -->
  <style>
    .panel  { font-size: 13px; font-weight: bold; fill: #1C2530; }
    .lab    { font-size: 10.5px; fill: #4A5B6E; }
    .q      { font-size: 11px; fill: #1C2530; }
    .mono   { font-size: 12px; font-family: "DejaVu Sans Mono", Menlo, monospace; fill: #1C2530; }
    .work   { font-size: 11px; font-family: "DejaVu Sans Mono", Menlo, monospace; fill: #4A5B6E; }
    .redhd  { font-size: 13px; font-weight: bold; fill: #8B3B4A; }
    .grnhd  { font-size: 13px; font-weight: bold; fill: #2E7A5A; }
    .verdictbad  { font-size: 13px; font-weight: bold; fill: #8B3B4A; }
    .verdictgood { font-size: 13px; font-weight: bold; fill: #2E7A5A; }
  </style>

  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>

  <text x="450" y="26" text-anchor="middle" class="panel">Same problem, two prompt structures: room to work changes the answer</text>

  <!-- ============================ LEFT: direct prompt ============================ -->
  <rect x="20" y="40" width="420" height="370" rx="6" fill="#ffffff" stroke="#8B3B4A" stroke-width="2"/>
  <text x="230" y="72" text-anchor="middle" class="redhd">DIRECT  (answer only)</text>

  <text x="44" y="106" class="q">Q: A jug holds 12 cups. You pour out</text>
  <text x="44" y="124" class="q">    1/3, then add 5 cups. How many</text>
  <text x="44" y="142" class="q">    cups are in the jug now?</text>

  <text x="44" y="222" class="mono" opacity="0">A: 9
    <animate attributeName="opacity" values="0;1;1;1;1;1;1;0" keyTimes="0;0.102;0.227;0.341;0.455;0.580;0.705;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="230" y="340" text-anchor="middle" class="verdictbad" opacity="0">✗  wrong  (blurted)
    <animate attributeName="opacity" values="0;1;1;1;1;1;1;0" keyTimes="0;0.102;0.227;0.341;0.455;0.580;0.705;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="230" y="378" text-anchor="middle" class="lab">no room to carry state — the model guesses a plausible number</text>

  <!-- ======================== RIGHT: chain-of-thought prompt ======================== -->
  <rect x="460" y="40" width="420" height="370" rx="6" fill="#ffffff" stroke="#2E7A5A" stroke-width="2"/>
  <text x="670" y="72" text-anchor="middle" class="grnhd">CHAIN-OF-THOUGHT  (step by step)</text>

  <text x="484" y="106" class="q">Q: ... (same problem)</text>

  <text x="484" y="134" class="q" opacity="0">A: Let's think step by step.
    <animate attributeName="opacity" values="0;0;1;1;1;1;1;0" keyTimes="0;0.102;0.227;0.341;0.455;0.580;0.705;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="484" y="166" class="work" opacity="0">  Start: 12 cups.
    <animate attributeName="opacity" values="0;0;0;1;1;1;1;0" keyTimes="0;0.102;0.227;0.341;0.455;0.580;0.705;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="484" y="186" class="work" opacity="0">  Pour out 1/3 of 12 = 4, leaving 8.
    <animate attributeName="opacity" values="0;0;0;0;1;1;1;0" keyTimes="0;0.102;0.227;0.341;0.455;0.580;0.705;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="484" y="206" class="work" opacity="0">  Add 5: 8 + 5 = 13.
    <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.102;0.227;0.341;0.455;0.580;0.705;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="484" y="254" class="mono" opacity="0">  Answer: 13
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;0" keyTimes="0;0.102;0.227;0.341;0.455;0.580;0.705;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="670" y="340" text-anchor="middle" class="verdictgood" opacity="0">✓  right  (worked)
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;0" keyTimes="0;0.102;0.227;0.341;0.455;0.580;0.705;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="670" y="378" text-anchor="middle" class="lab">each line carries the intermediate value the next line needs</text>

  <text x="450" y="430" text-anchor="middle" class="lab">Nothing about the model changed between the two panels — only the prompt did.</text>
</svg>
