<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <!-- Post-hoc attribution, animated one claim at a time over a 12s SMIL loop. Same data as the
       retired code/make_animation_13.py, replaying the printed output of
       code/13-Citations-and-Attribution.ipynb: the three retrieved passages are corpus docs
       [1], [0], [2]; claim 1 cites [2] at cos 0.93, claim 2 cites [1] at cos 0.78, and the
       fabricated solar-panels claim clears no passage (best cos 0.49 < the 0.5 support bar) so
       it is flagged UNCITABLE — final tally 2 cited, 1 flagged. Every claim, citation and
       cosine is that recorded output. All six boxes are drawn at t=0, so the first frame reads
       as a complete claims-vs-passages map even when the asset is viewed paused. -->
  <style>
    .panel  { font-size: 13px; font-weight: bold; fill: #1C2530; }
    .lab    { font-size: 10.5px; fill: #4A5B6E; }
    .mono   { font-size: 10.5px; font-family: "DejaVu Sans Mono", Menlo, monospace; fill: #1C2530; }
    .score  { font-size: 10.5px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-weight: bold; fill: #2E7A5A; }
    .bad    { font-size: 10px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-weight: bold; fill: #8B3B4A; }
    .big    { font-size: 12px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-weight: bold; fill: #1C2530; }
  </style>

  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2E7A5A"/>
    </marker>
  </defs>

  <text x="450" y="26" text-anchor="middle" class="panel" font-size="14">Post-hoc attribution: attach each claim to its source, one at a time</text>
  <text x="185" y="54" text-anchor="middle" class="lab" font-weight="bold" fill="#1C2530">ANSWER claims (split from the generated answer)</text>
  <text x="711" y="54" text-anchor="middle" class="lab" font-weight="bold" fill="#3A6B96">RETRIEVED passages (what a claim may cite)</text>

  <!-- ============================ the three retrieved passages ============================ -->
  <g>
    <rect x="546" y="68" width="330" height="52" rx="4" fill="#3A6B96" fill-opacity="0.10" stroke="#3A6B96"/>
    <text x="558" y="90" class="mono">[1] Helios-7 carries a hyperspectral imager</text>
    <text x="558" y="106" class="mono">    with a ground resolution of 4 meters.</text>
    <rect x="546" y="160" width="330" height="52" rx="4" fill="#3A6B96" fill-opacity="0.10" stroke="#3A6B96"/>
    <text x="558" y="182" class="mono">[2] The Helios-7 satellite was launched on</text>
    <text x="558" y="198" class="mono">    March 3rd, 2024 from the Kourou spaceport.</text>
    <rect x="546" y="252" width="330" height="52" rx="4" fill="#3A6B96" fill-opacity="0.10" stroke="#3A6B96"/>
    <text x="558" y="274" class="mono">[3] The project lead for Helios-7 is Dr. Amara</text>
    <text x="558" y="290" class="mono">    Okoye, based in the Nairobi office.</text>
  </g>

  <!-- ============================ claim 1 — cites passage [2] ============================ -->
  <rect x="20" y="68" width="330" height="52" rx="4" fill="#fbfbfc" stroke="#D4D9DF"/>
  <text x="32" y="90" class="mono" fill="#7C8794">Helios-7 launched on March 3rd, 2024
    <animate attributeName="fill" values="#7C8794;#1C2530;#1C2530" keyTimes="0;0.16;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="32" y="106" class="mono" fill="#7C8794">from the Kourou spaceport.
    <animate attributeName="fill" values="#7C8794;#1C2530;#1C2530" keyTimes="0;0.16;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.16;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <rect x="20" y="68" width="330" height="52" rx="4" fill="#2E7A5A" fill-opacity="0.15" stroke="#2E7A5A"/>
    <text x="340" y="99" text-anchor="end" class="score" font-size="12">[2]</text>
    <path d="M354 94 L540 184" stroke="#2E7A5A" stroke-width="1.8" fill="none" marker-end="url(#arwg)"/>
    <rect x="368" y="106" width="66" height="18" rx="3" fill="#ffffff" stroke="#2E7A5A"/>
    <text x="401" y="119" text-anchor="middle" class="score">cos 0.93</text>
  </g>

  <!-- ============================ claim 2 — cites passage [1] ============================ -->
  <rect x="20" y="160" width="330" height="52" rx="4" fill="#fbfbfc" stroke="#D4D9DF"/>
  <text x="32" y="182" class="mono" fill="#7C8794">Its hyperspectral imager has a ground
    <animate attributeName="fill" values="#7C8794;#1C2530;#1C2530" keyTimes="0;0.38;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="32" y="198" class="mono" fill="#7C8794">resolution of 4 meters.
    <animate attributeName="fill" values="#7C8794;#1C2530;#1C2530" keyTimes="0;0.38;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.38;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <rect x="20" y="160" width="330" height="52" rx="4" fill="#2E7A5A" fill-opacity="0.15" stroke="#2E7A5A"/>
    <text x="340" y="191" text-anchor="end" class="score" font-size="12">[1]</text>
    <path d="M354 186 L540 96" stroke="#2E7A5A" stroke-width="1.8" fill="none" marker-end="url(#arwg)"/>
    <rect x="368" y="160" width="66" height="18" rx="3" fill="#ffffff" stroke="#2E7A5A"/>
    <text x="401" y="173" text-anchor="middle" class="score">cos 0.78</text>
  </g>

  <!-- ============================ claim 3 — matches nothing, UNCITABLE ============================ -->
  <rect x="20" y="252" width="330" height="52" rx="4" fill="#fbfbfc" stroke="#D4D9DF"/>
  <text x="32" y="274" class="mono" fill="#7C8794">Helios-7 is powered entirely by
    <animate attributeName="fill" values="#7C8794;#1C2530;#1C2530" keyTimes="0;0.6;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="32" y="290" class="mono" fill="#7C8794">solar panels.
    <animate attributeName="fill" values="#7C8794;#1C2530;#1C2530" keyTimes="0;0.6;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.6;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <rect x="20" y="252" width="330" height="52" rx="4" fill="#8B3B4A" fill-opacity="0.15" stroke="#8B3B4A"/>
    <text x="340" y="283" text-anchor="end" class="bad" font-size="12">[?]</text>
    <text x="362" y="272" class="bad">UNCITABLE — best cos 0.49</text>
    <text x="362" y="287" class="bad">&lt; 0.5, so no passage is cited</text>
  </g>

  <!-- ============================ the tally, assembling ============================ -->
  <rect x="280" y="330" width="340" height="34" rx="6" fill="#2E7A5A" fill-opacity="0.10" stroke="#2E7A5A"/>
  <g text-anchor="middle">
    <text x="450" y="352" class="big" fill="#7C8794">cited to a source: 0  ·  flagged uncitable: 0
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.16;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="352" class="big" opacity="0">cited to a source: 1  ·  flagged uncitable: 0
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.16;0.38;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="352" class="big" opacity="0">cited to a source: 2  ·  flagged uncitable: 0
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.38;0.6;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="352" class="big" opacity="0">cited to a source: 2  ·  flagged uncitable: 1
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.6;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="450" y="386" text-anchor="middle" class="bad" font-size="10.5" font-style="italic" opacity="0">the fabricated 'solar panels' claim matches NO passage → flagged [?]. a fluent hallucination, caught.
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.76;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="412" text-anchor="middle" class="lab">A claim is citable only if its best cosine to some retrieved passage clears τ = 0.5 — which is what makes</text>
  <text x="450" y="427" text-anchor="middle" class="lab">an answer checkable: every sentence either points at a source a reader can open, or is marked unsupported.</text>
  <text x="450" y="448" text-anchor="middle" class="lab" font-size="9.5" font-style="italic" fill="#7C8794">claims, citations and cosines are REAL citations_attribution.py output; the claim-split and the generator are illustrative LLM stand-ins</text>
</svg>
