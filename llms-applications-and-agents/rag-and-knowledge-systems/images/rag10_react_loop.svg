<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <!-- The ReAct loop iterating to an answer, animated on a 12s SMIL loop. Left: the three loop nodes
       lighting in turn - Thought, Action, Observation - with the step badge coloured by the tool the
       agent picked. Right: the agent's own trace, revealed beat by beat, then the assembled answer.
       Every Thought, Action, Observation and the final answer are the REAL output of
       agentic_rag.py's ReActAgent running compound_orbit_policy over the shared Helios-7 corpus:
       retrieve the 97-minute period, compute 1440 / 97 = 14.8454, retrieve the 4-metre imager
       resolution, finish. Only the Thought text is an illustrative LLM-policy stand-in. The query,
       the loop and step 1's Thought are drawn at t=0, so the first frame already reads. -->
  <style>
    .title { font-size: 14px; font-weight: bold; fill: #1C2530; }
    .q     { font-size: 10.5px; font-style: italic; fill: #4A5B6E; }
    .lab   { font-size: 10.5px; fill: #4A5B6E; }
    .node  { font-size: 11px; font-weight: bold; }
    .beat  { font-size: 11px; font-weight: bold; }
    .mono  { font-size: 10.5px; font-family: "DejaVu Sans Mono", Menlo, monospace; fill: #1C2530; }
    .think { font-size: 10.5px; font-style: italic; fill: #5D4A8A; }
    .act   { font-size: 10.5px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-weight: bold; }
    .badge { font-size: 10.5px; font-weight: bold; fill: #ffffff; }
    .ans   { font-size: 11px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-weight: bold; fill: #2E7A5A; }
    .foot  { font-size: 10px; fill: #7C8794; font-style: italic; }
  </style>

  <defs>
    <marker id="arw10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1C2530"/>
    </marker>
    <marker id="arw10g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2E7A5A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <rect x="10" y="10" width="880" height="440" rx="6" fill="#fbfbfc" stroke="#D4D9DF"/>

  <text x="450" y="34" text-anchor="middle" class="title">Agentic RAG: the ReAct loop iterating to an answer</text>
  <text x="450" y="54" text-anchor="middle" class="q">query: "How many complete orbits does Helios-7 make in one day, and what is the ground resolution of its imager?"</text>

  <!-- ============================ LEFT: the loop ============================ -->
  <rect x="46" y="88" width="240" height="44" rx="5" fill="#5D4A8A" stroke="#5D4A8A" stroke-width="1.6"/>
  <text x="166" y="115" text-anchor="middle" class="node" fill="#ffffff">THOUGHT</text>
  <path d="M166 134 L166 160" stroke="#1C2530" stroke-width="1.3" marker-end="url(#arw10)"/>

  <rect x="46" y="164" width="240" height="44" rx="5" fill="#ffffff" stroke="#7A6528" stroke-width="1.6"/>
  <rect x="46" y="164" width="240" height="44" rx="5" fill="#7A6528" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0;1;0;1;0" keyTimes="0;0.06;0.20;0.26;0.40;0.46;0.60;0.66;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="166" y="191" text-anchor="middle" class="node" fill="#4A5B6E">ACTION</text>
  <text x="166" y="191" text-anchor="middle" class="node" fill="#ffffff" opacity="0">ACTION
    <animate attributeName="opacity" values="0;1;0;1;0;1;0;1;0" keyTimes="0;0.06;0.20;0.26;0.40;0.46;0.60;0.66;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <path d="M166 210 L166 236" stroke="#1C2530" stroke-width="1.3" marker-end="url(#arw10)"/>

  <rect x="46" y="240" width="240" height="44" rx="5" fill="#ffffff" stroke="#3A6B96" stroke-width="1.6"/>
  <rect x="46" y="240" width="240" height="44" rx="5" fill="#3A6B96" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0;1;0;1;0" keyTimes="0;0.12;0.20;0.32;0.40;0.52;0.60;0.78;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="166" y="267" text-anchor="middle" class="node" fill="#4A5B6E">OBSERVATION</text>
  <text x="166" y="267" text-anchor="middle" class="node" fill="#ffffff" opacity="0">OBSERVATION
    <animate attributeName="opacity" values="0;1;0;1;0;1;0;1;0" keyTimes="0;0.12;0.20;0.32;0.40;0.52;0.60;0.78;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- loop back: observation feeds the next thought -->
  <path d="M46 262 C 16 250, 16 122, 44 108" fill="none" stroke="#2E7A5A" stroke-width="1.6" marker-end="url(#arw10g)"/>
  <text x="24" y="190" class="lab" fill="#2E7A5A" font-weight="bold" font-style="italic" text-anchor="middle" transform="rotate(-90 24 190)">loop</text>

  <!-- the step badge, coloured by the tool the policy picked -->
  <g>
    <rect x="106" y="308" width="120" height="24" rx="6" fill="#3A6B96" stroke="#1C2530">
      <animate attributeName="opacity" values="1;0;1;0;1" keyTimes="0;0.20;0.40;0.60;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="106" y="308" width="120" height="24" rx="6" fill="#7A6528" stroke="#1C2530" opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.20;0.40;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="106" y="308" width="120" height="24" rx="6" fill="#2E7A5A" stroke="#1C2530" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.60;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="166" y="324" text-anchor="middle" class="badge">step 1 of 4
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.20;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="166" y="324" text-anchor="middle" class="badge" opacity="0">step 2 of 4
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.20;0.40;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="166" y="324" text-anchor="middle" class="badge" opacity="0">step 3 of 4
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.40;0.60;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="166" y="324" text-anchor="middle" class="badge" opacity="0">step 4 of 4
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.60;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="166" y="356" text-anchor="middle" class="lab">tool: retrieve
    <animate attributeName="opacity" values="1;0;1;0;1" keyTimes="0;0.20;0.40;0.60;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="166" y="356" text-anchor="middle" class="lab" opacity="0">tool: calculator
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.20;0.40;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="166" y="356" text-anchor="middle" class="lab" opacity="0">tool: finish
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.60;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- ============================ RIGHT: the real trace ============================ -->
  <text x="330" y="102" class="beat" fill="#5D4A8A">Thought:</text>
  <g>
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.20;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="330" y="122" class="think">The question has two parts. First I need the orbit period,</text>
    <text x="330" y="138" class="think">then I can compute orbits per day.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.20;0.40;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="330" y="122" class="think">The passage says the period is 97 minutes. A day has 1440</text>
    <text x="330" y="138" class="think">minutes, so I divide to get orbits per day.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.40;0.60;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="330" y="122" class="think">That gives the orbits per day; the whole-number part is the</text>
    <text x="330" y="138" class="think">count of COMPLETE orbits. Now I still need the imager's</text>
    <text x="330" y="154" class="think">ground resolution.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.60;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="330" y="122" class="think">I now have both facts: the orbit count and the resolution.</text>
    <text x="330" y="138" class="think">I can answer.</text>
  </g>

  <text x="330" y="182" class="beat" fill="#7A6528" opacity="0">Action:
    <animate attributeName="opacity" values="0;1;0;1;0;1;0;1;0" keyTimes="0;0.06;0.20;0.26;0.40;0.46;0.60;0.66;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="330" y="202" class="act" fill="#3A6B96" opacity="0">retrieve('Helios-7 orbit period in minutes')
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.06;0.20;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="330" y="202" class="act" fill="#7A6528" opacity="0">calculator('1440 / 97')
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.26;0.40;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="330" y="202" class="act" fill="#3A6B96" opacity="0">retrieve('Helios-7 imager ground resolution')
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.46;0.60;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.66;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="330" y="202" class="act" fill="#2E7A5A">finish('Helios-7 completes 14 full orbits per day (14.85 raw),</text>
    <text x="330" y="218" class="act" fill="#2E7A5A">and its imager has a ground resolution of 4 meters.')</text>
  </g>

  <text x="330" y="258" class="beat" fill="#3A6B96" opacity="0">Observation:
    <animate attributeName="opacity" values="0;1;0;1;0;1;0;0" keyTimes="0;0.12;0.20;0.32;0.40;0.52;0.60;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.12;0.20;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="330" y="278" class="mono">Helios-7 completes one orbit of Earth every 97 minutes in a</text>
    <text x="330" y="294" class="mono">sun-synchronous orbit.</text>
  </g>
  <text x="330" y="278" class="mono" opacity="0">1440 / 97 = 14.8454
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.32;0.40;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.52;0.60;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <text x="330" y="278" class="mono">Helios-7 carries a hyperspectral imager with a ground</text>
    <text x="330" y="294" class="mono">resolution of 4 meters.</text>
  </g>

  <!-- the running answer, assembling fact by fact -->
  <text x="330" y="334" class="beat" fill="#2E7A5A" opacity="0">assembling answer:
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.12;0.78;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="330" y="354" class="ans" opacity="0">period: 97 min
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.12;0.32;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="330" y="354" class="ans" opacity="0">→ 14 orbits/day
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.32;0.52;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="330" y="354" class="ans" opacity="0">+ imager: 4 m
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.52;0.66;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="330" y="354" class="ans" opacity="0">answer ready
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.66;0.78;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- the finished answer -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.78;0.99" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <rect x="322" y="322" width="556" height="52" rx="5" fill="#2E7A5A" fill-opacity="0.16" stroke="#2E7A5A" stroke-width="1.6"/>
    <text x="332" y="342" class="ans">ANSWER: Helios-7 completes 14 full orbits per day (14.85 raw),</text>
    <text x="332" y="360" class="ans">and its imager has a ground resolution of 4 meters.</text>
  </g>

  <text x="450" y="400" text-anchor="middle" class="lab">Static single-shot RAG retrieves once and generates once — it has no step that does arithmetic, so</text>
  <text x="450" y="415" text-anchor="middle" class="lab">the "how many orbits per day" half of this query is structurally unanswerable. The loop is the fix.</text>
  <text x="450" y="440" text-anchor="middle" class="foot">loop, tools, retrieval and arithmetic are REAL all-MiniLM / calculator outputs; the Thought text is an illustrative LLM-policy stand-in</text>
</svg>
