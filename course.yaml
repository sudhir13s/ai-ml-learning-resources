# course.yaml — AI/ML Learning Resources, in the estate/v2 declaration envelope.
#
# Spec:    docs/plans/structure-rework/commons/declaration-schema.md
# Charter: docs/plans/structure-rework/ai-ml-blueprints/ai-ml-learning-resources-structure.md
# Declaration: docs/plans/structure-rework/ai-ml-blueprints/ai-ml-blueprint-index.md
#   section "Course declaration - AI-ML/AI-ML-study-notes/ai-ml-learning-resources/course.yaml".
# Placement rule: docs/plans/aiml-layer-restructure/2026-09-12T23-38-aiml-layer-restructure-plan.md
# Validate from interview-prep-app/:
#   npx tsx scripts/validate-structure.ts --root <this module root>
#
# THE SHAPE (wave W2 of the layer plan, 2026-09-13)
#
# This tab is the MODEL layer of the AI/ML hub: anything that makes, changes,
# measures or serves a model. Sections follow the model lifecycle after the
# foundations: foundations -> classical machine learning -> reinforcement
# learning -> deep learning -> models and architectures -> data and
# representation -> model building -> model adaptation -> inference and serving
# -> evaluation -> operations and lifecycle -> multimodal and generative media ->
# world models and embodied AI -> frontier and specialized.
#
# Two folder depths coexist, and the declaration says which is which:
#   - `<section>/<sub-area>/<topic>/<topic>.md` — the sub-area is the grouping
#     folder, the page's `category` names it, and the section declares
#     `group_by: category` so the nav shows the sub-areas as collapsible groups.
#   - `<section>/<topic>/<topic>.md` — the section IS the sub-area (model
#     building, model adaptation, inference and serving, evaluation). The page's
#     `category` is the section id, the section declares NO `group_by` (one
#     group named after its own section is noise), and a multi-page topic
#     package nests as its own section (`lr-kv-cache`, `lr-inference-optimization`).
#   - A sub-area whose pages should read as one course inside a flat section
#     nests as a section too: `is-packaging-and-serving`, and
#     `ma-generative-model-families` (which keeps `generative-models` and
#     `diffusion-models` as its two groups). `data-and-representation` groups by
#     category instead — the federation gate caps a flat nested section at twelve
#     entries and data-preparation has thirteen — so its single-page topic
#     `synthetic-data-and-curation` carries its own folder name as `category`.
#
# `llms-applications-and-agents` is TRANSITIONAL. Its model-layer sub-areas left
# in this wave (large-language-model-foundations, llm-model-architectures,
# training-and-adaptation, inference-and-runtime, reasoning-evaluation-and-
# alignment); the two application-layer sub-areas that remain, RAG and agentic
# AI, harvest into Practitioner Workflows in wave W4 (rows B1-B10), after which
# the section and its folder are deleted.
#
# ROOT-FOLDER NAME — owner ruling 2026-08-19 (T-307.1): folder, GitHub repo,
# module id and route unify on `ai-ml-learning-resources`.
#
# NOT DECLARED, deliberately: every README.md, metadata.yaml, images/, code/,
# notebooks/ and tools/ folder, every *.references.md companion, `_meta/`, and
# the two `overview.md` catalogues under llms-applications-and-agents (T-203.5).
