<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <!-- Static vs continuous batching, played forward on one 12s SMIL clock. A red clock cursor
       sweeps decode steps 0 to 84 over the first 9s, and every bar fills in only as the cursor
       passes it; the finished chart then rests for ~2.4s before the loop resets. The dashed
       hairline outlines show the WHOLE schedule from t=0, so the first frame is already a
       readable figure. Every segment, duration and makespan is the exact simulation schedule
       that the retired generator tools/make_animations_09.py drew (its STATIC_BARS and
       CONT_BARS tables, carried over verbatim when this SVG replaced the GIF): the same 6 ragged
       requests A/B/C/D/E/F of 4/6/20/60/5/8 decode steps on 3 slots, 10 ms per step, static
       finishing at step 80 (800 ms) and continuous at step 64 (640 ms) - 1.25x sooner. -->
  <style>
    .panel  { font-size: 13px; font-weight: bold; fill: #1C2530; }
    .lab    { font-size: 10.5px; fill: #4A5B6E; }
    .mono   { font-size: 10.5px; font-family: "DejaVu Sans Mono", Menlo, monospace; fill: #1C2530; }
    .monodim{ font-size: 10.5px; font-family: "DejaVu Sans Mono", Menlo, monospace; fill: #7C8794; }
    .bar    { font-size: 11.5px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-weight: bold; text-anchor: middle; }
    .idle   { font-size: 10px; fill: #7C8794; text-anchor: middle; }
  </style>

  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#4A5B6E" stroke-width="1.3" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <text x="450" y="26" text-anchor="middle" class="panel" font-size="13.5">Same 6 ragged requests (4/6/20/60/5/8 tok), 3 slots: continuous finishes 1.25&#215; sooner</text>

  <!-- ======================== panel 1: STATIC ======================== -->
  <text x="24" y="52" class="panel" font-size="11.5">STATIC &#8212; freed slots sit idle until the wave&#8217;s longest ends (80 steps)</text>

  <text x="105" y="79"  class="lab" text-anchor="end">slot 1</text>
  <text x="105" y="113" class="lab" text-anchor="end">slot 2</text>
  <text x="105" y="147" class="lab" text-anchor="end">slot 3</text>

  <!-- the whole schedule as dashed outlines: readable at t=0, filled in by the clock -->
  <g fill="none" stroke="#D4D9DF" stroke-dasharray="3 3">
    <rect x="115" y="62" width="34" height="26" rx="3"/>
    <rect x="149" y="62" width="136" height="26" rx="3"/>
    <rect x="285" y="62" width="510" height="26" rx="3"/>
    <rect x="115" y="96" width="51" height="26" rx="3"/>
    <rect x="166" y="96" width="119" height="26" rx="3"/>
    <rect x="285" y="96" width="42.5" height="26" rx="3"/>
    <rect x="327.5" y="96" width="467.5" height="26" rx="3"/>
    <rect x="115" y="130" width="170" height="26" rx="3"/>
    <rect x="285" y="130" width="68" height="26" rx="3"/>
    <rect x="353" y="130" width="442" height="26" rx="3"/>
  </g>

  <!-- ======================== panel 2: CONTINUOUS ======================== -->
  <text x="24" y="196" class="panel" font-size="11.5">CONTINUOUS &#8212; a freed slot is backfilled the next step (64 steps)</text>

  <text x="105" y="223" class="lab" text-anchor="end">slot 1</text>
  <text x="105" y="257" class="lab" text-anchor="end">slot 2</text>
  <text x="105" y="291" class="lab" text-anchor="end">slot 3</text>

  <g fill="none" stroke="#D4D9DF" stroke-dasharray="3 3">
    <rect x="115" y="206" width="34" height="26" rx="3"/>
    <rect x="149" y="206" width="510" height="26" rx="3"/>
    <rect x="115" y="240" width="51" height="26" rx="3"/>
    <rect x="166" y="240" width="42.5" height="26" rx="3"/>
    <rect x="208.5" y="240" width="68" height="26" rx="3"/>
    <rect x="276.5" y="240" width="382.5" height="26" rx="3"/>
    <rect x="115" y="274" width="170" height="26" rx="3"/>
    <rect x="285" y="274" width="374" height="26" rx="3"/>
  </g>

  <!-- ======================== the played timeline ======================== -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.95;0.995;1" dur="12s" repeatCount="indefinite"/>

    <!-- STATIC slot 1: A(0-4) idle(4-20) D(20-80) -->
    <rect x="115" y="62" height="26" rx="3" width="0" fill="#3A6B96" fill-opacity="0.20" stroke="#3A6B96" stroke-width="1.6">
      <animate attributeName="width" values="0;34;34" keyTimes="0;0.0357;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="149" y="62" height="26" rx="3" width="0" fill="url(#hatch)" stroke="#4A5B6E" stroke-opacity="0.5">
      <animate attributeName="width" values="0;0;136;136" keyTimes="0;0.0357;0.1786;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="285" y="62" height="26" rx="3" width="0" fill="#8B3B4A" fill-opacity="0.20" stroke="#8B3B4A" stroke-width="1.6">
      <animate attributeName="width" values="0;0;510;510" keyTimes="0;0.1786;0.7143;1" dur="12s" repeatCount="indefinite"/></rect>

    <!-- STATIC slot 2: B(0-6) idle(6-20) E(20-25) idle(25-80) -->
    <rect x="115" y="96" height="26" rx="3" width="0" fill="#3A6B96" fill-opacity="0.20" stroke="#3A6B96" stroke-width="1.6">
      <animate attributeName="width" values="0;51;51" keyTimes="0;0.0536;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="166" y="96" height="26" rx="3" width="0" fill="url(#hatch)" stroke="#4A5B6E" stroke-opacity="0.5">
      <animate attributeName="width" values="0;0;119;119" keyTimes="0;0.0536;0.1786;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="285" y="96" height="26" rx="3" width="0" fill="#2E7A5A" fill-opacity="0.20" stroke="#2E7A5A" stroke-width="1.6">
      <animate attributeName="width" values="0;0;42.5;42.5" keyTimes="0;0.1786;0.2232;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="327.5" y="96" height="26" rx="3" width="0" fill="url(#hatch)" stroke="#4A5B6E" stroke-opacity="0.5">
      <animate attributeName="width" values="0;0;467.5;467.5" keyTimes="0;0.2232;0.7143;1" dur="12s" repeatCount="indefinite"/></rect>

    <!-- STATIC slot 3: C(0-20) F(20-28) idle(28-80) -->
    <rect x="115" y="130" height="26" rx="3" width="0" fill="#5D4A8A" fill-opacity="0.20" stroke="#5D4A8A" stroke-width="1.6">
      <animate attributeName="width" values="0;170;170" keyTimes="0;0.1786;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="285" y="130" height="26" rx="3" width="0" fill="#2E7A5A" fill-opacity="0.20" stroke="#2E7A5A" stroke-width="1.6">
      <animate attributeName="width" values="0;0;68;68" keyTimes="0;0.1786;0.25;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="353" y="130" height="26" rx="3" width="0" fill="url(#hatch)" stroke="#4A5B6E" stroke-opacity="0.5">
      <animate attributeName="width" values="0;0;442;442" keyTimes="0;0.25;0.7143;1" dur="12s" repeatCount="indefinite"/></rect>

    <!-- static makespan marker -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7143;0.73;1" dur="12s" repeatCount="indefinite"/>
      <line x1="795" y1="56" x2="795" y2="160" stroke="#1C2530" stroke-width="1.6" stroke-dasharray="5 4"/>
      <text x="801" y="72" class="mono" font-weight="bold">done</text>
      <text x="801" y="86" class="mono" font-weight="bold">800 ms</text>
    </g>

    <!-- CONTINUOUS slot 1: A(0-4) D(4-64) -->
    <rect x="115" y="206" height="26" rx="3" width="0" fill="#3A6B96" fill-opacity="0.20" stroke="#3A6B96" stroke-width="1.6">
      <animate attributeName="width" values="0;34;34" keyTimes="0;0.0357;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="149" y="206" height="26" rx="3" width="0" fill="#8B3B4A" fill-opacity="0.20" stroke="#8B3B4A" stroke-width="1.6">
      <animate attributeName="width" values="0;0;510;510" keyTimes="0;0.0357;0.5714;1" dur="12s" repeatCount="indefinite"/></rect>

    <!-- CONTINUOUS slot 2: B(0-6) E(6-11) F(11-19) idle(19-64) -->
    <rect x="115" y="240" height="26" rx="3" width="0" fill="#3A6B96" fill-opacity="0.20" stroke="#3A6B96" stroke-width="1.6">
      <animate attributeName="width" values="0;51;51" keyTimes="0;0.0536;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="166" y="240" height="26" rx="3" width="0" fill="#2E7A5A" fill-opacity="0.20" stroke="#2E7A5A" stroke-width="1.6">
      <animate attributeName="width" values="0;0;42.5;42.5" keyTimes="0;0.0536;0.0982;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="208.5" y="240" height="26" rx="3" width="0" fill="#2E7A5A" fill-opacity="0.20" stroke="#2E7A5A" stroke-width="1.6">
      <animate attributeName="width" values="0;0;68;68" keyTimes="0;0.0982;0.1696;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="276.5" y="240" height="26" rx="3" width="0" fill="url(#hatch)" stroke="#4A5B6E" stroke-opacity="0.5">
      <animate attributeName="width" values="0;0;382.5;382.5" keyTimes="0;0.1696;0.5714;1" dur="12s" repeatCount="indefinite"/></rect>

    <!-- CONTINUOUS slot 3: C(0-20) idle(20-64) -->
    <rect x="115" y="274" height="26" rx="3" width="0" fill="#5D4A8A" fill-opacity="0.20" stroke="#5D4A8A" stroke-width="1.6">
      <animate attributeName="width" values="0;170;170" keyTimes="0;0.1786;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="285" y="274" height="26" rx="3" width="0" fill="url(#hatch)" stroke="#4A5B6E" stroke-opacity="0.5">
      <animate attributeName="width" values="0;0;374;374" keyTimes="0;0.1786;0.5714;1" dur="12s" repeatCount="indefinite"/></rect>

    <!-- continuous makespan marker -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5714;0.59;1" dur="12s" repeatCount="indefinite"/>
      <line x1="659" y1="200" x2="659" y2="304" stroke="#1C2530" stroke-width="1.6" stroke-dasharray="5 4"/>
      <text x="665" y="216" class="mono" font-weight="bold">done</text>
      <text x="665" y="230" class="mono" font-weight="bold">640 ms</text>
    </g>

    <!-- the clock cursor, sweeping steps 0 to 84 across both panels -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;714 0;714 0" keyTimes="0;0.75;1" dur="12s" repeatCount="indefinite"/>
      <line x1="115" y1="56" x2="115" y2="304" stroke="#8B3B4A" stroke-width="1.4" opacity="0.75"/>
    </g>
  </g>

  <!-- bar labels sit on top, so they read at every moment including t=0 -->
  <g class="bar">
    <text x="132" y="79"  fill="#3A6B96">A</text>
    <text x="540" y="79"  fill="#8B3B4A">D</text>
    <text x="140.5" y="113" fill="#3A6B96">B</text>
    <text x="306" y="113" fill="#2E7A5A">E</text>
    <text x="200" y="147" fill="#5D4A8A">C</text>
    <text x="319" y="147" fill="#2E7A5A">F</text>
    <text x="132" y="223" fill="#3A6B96">A</text>
    <text x="404" y="223" fill="#8B3B4A">D</text>
    <text x="140.5" y="257" fill="#3A6B96">B</text>
    <text x="187" y="257" fill="#2E7A5A">E</text>
    <text x="242.5" y="257" fill="#2E7A5A">F</text>
    <text x="200" y="291" fill="#5D4A8A">C</text>
  </g>
  <g class="idle">
    <text x="217" y="80">idle</text>
    <text x="225.5" y="114">idle</text>
    <text x="561.5" y="114">idle</text>
    <text x="574" y="148">idle</text>
    <text x="467.5" y="258">idle</text>
    <text x="472" y="292">idle</text>
  </g>

  <!-- shared x axis -->
  <line x1="115" y1="308" x2="829" y2="308" stroke="#4A5B6E" stroke-width="1.2"/>
  <g class="monodim" text-anchor="middle">
    <text x="115" y="324">0</text>
    <text x="285" y="324">20</text>
    <text x="455" y="324">40</text>
    <text x="625" y="324">60</text>
    <text x="795" y="324">80</text>
  </g>
  <text x="472" y="344" class="lab" text-anchor="middle">Decode steps (10 ms each, modeled)</text>

  <text x="24" y="378" class="lab">Static batching runs locked waves: A frees slot 1 at step 4 but nothing may enter until the whole wave ends at step 20, so 16 steps of</text>
  <text x="24" y="395" class="lab">slot 1 are hatched away &#8212; and the long request D only starts then, dragging the makespan out to step 80.</text>
  <text x="24" y="418" class="lab">Continuous batching admits D the instant A releases slot 1 at step 4, and backfills E then F into slot 2 the same way, finishing at</text>
  <text x="24" y="435" class="lab">step 64. Same hardware, same 6 requests, same total work: <tspan font-weight="bold" fill="#1C2530">800 ms &#8594; 640 ms, a 1.25&#215; speedup bought purely by scheduling.</tspan></text>
</svg>
