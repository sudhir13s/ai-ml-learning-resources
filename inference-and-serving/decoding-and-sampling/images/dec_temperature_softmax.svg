  <text x="82" y="364" text-anchor="end" class="axis">0.0</text>
  <line x1="90" y1="304" x2="860" y2="304" stroke="#D4D9DF" stroke-width="0.8"/>
  <text x="82" y="308" text-anchor="end" class="axis">0.2</text>
