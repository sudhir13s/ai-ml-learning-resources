<svg viewBox="0 0 900 456" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <!-- The temperature dial, swept over a 12s SMIL loop: the same peaked next-token distribution
       (logits 5.0, 8.0, 4.0, 3.5, 3.0, 2.5, 2.0, 1.5, 1.0, 0.5 over the toy 10-word vocab of
       decoding_sampling.py) is re-softmaxed at each step of the sweep T = 0.5 -> 1.0 -> 2.0 -> 0.5,
       holding on the three anchor temperatures the static figure marks. Every bar height is
       softmax(z/T) and every read-out is entropy_bits of that same distribution, so the numbers
       match the chapter's static figure (tools/make_figures_18.py) exactly at its three marked
       anchors (T=0.5: "cat" holds 0.997 of the mass, 0.03 bits;
       T=1.0: 0.913, 0.61 bits; T=2.0: 0.571, 2.20 bits). Bars turn amber above T=1, as in the GIF.
       t=0 shows the T=0.5 frame in full, so the asset reads paused. -->
  <style>
    .title { font-size: 14px; font-weight: bold; fill: #1C2530; }
    .lab   { font-size: 10.5px; fill: #4A5B6E; }
    .axis  { font-size: 10.5px; fill: #4A5B6E; }
    .tokn  { font-size: 11px; font-family: "DejaVu Sans Mono", Menlo, monospace; fill: #1C2530; }
    .read  { font-size: 13px; font-family: "DejaVu Sans Mono", Menlo, monospace; font-weight: bold; fill: #1C2530; }
  </style>

  <rect x="0" y="0" width="900" height="456" fill="#ffffff"/>

  <text x="30" y="32" class="title">Temperature reshapes the next-token softmax</text>

  <!-- the dial: a marker sliding along the swept temperature range -->
  <text x="628" y="34" text-anchor="end" class="lab">temperature sweep</text>
  <line x1="640" y1="30" x2="865" y2="30" stroke="#4A5B6E" stroke-width="2"/>
  <line x1="640.0" y1="24" x2="640.0" y2="36" stroke="#4A5B6E" stroke-width="1"/>
  <text x="640.0" y="52" text-anchor="middle" class="lab">0.5</text>
  <line x1="715.0" y1="24" x2="715.0" y2="36" stroke="#4A5B6E" stroke-width="1"/>
  <text x="715.0" y="52" text-anchor="middle" class="lab">1.0</text>
  <line x1="865.0" y1="24" x2="865.0" y2="36" stroke="#4A5B6E" stroke-width="1"/>
  <text x="865.0" y="52" text-anchor="middle" class="lab">2.0</text>
  <circle cx="640.0" cy="30" r="6" fill="#1C2530">
